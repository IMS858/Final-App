<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exercise Library · IMS Coach OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ims-ui.css">
<style>
:root {
  --navy: #0B1E31;
  --navy-deep: #060D18;
  --navy-soft: #16304D;
  --sky: #3477BB;
  --sky-light: #5F9BD5;
  --cream: #EBEEF4;
  --cream-dim: #A8B2C4;
  --ghost: #1A2F4A;
  --divider: #2A4468;
  --limited: #E25C45;
  --moderate: #D4A836;
  --optimal: #4CA98A;
  --serif: 'Lora', Georgia, serif;
  --sans: 'Poppins', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--navy-deep);
  color: var(--cream);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }

/* ── Layout ─────────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* ── Sidebar ────────────────────────────────────────────── */
.sidebar {
  background: var(--navy-deep);
  border-right: 1px solid var(--divider);
  padding: 28px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: 0.5px;
  padding: 0 24px 24px 24px;
  border-bottom: 1px solid var(--divider);
  margin-bottom: 16px;
}
.sidebar-brand .accent { color: var(--sky-light); }

.nav-section-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--cream-dim);
  padding: 16px 24px 8px;
  font-weight: 500;
}

.nav-link {
  display: block;
  padding: 10px 24px;
  color: var(--cream-dim);
  font-size: 13px;
  font-weight: 400;
  border-left: 2px solid transparent;
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
.nav-link:hover { color: var(--cream); background: rgba(95, 155, 213, 0.06); }
.nav-link.active {
  color: var(--cream);
  border-left-color: var(--sky-light);
  background: rgba(95, 155, 213, 0.08);
}

/* ── Main panel ─────────────────────────────────────────── */
.main {
  padding: 32px 40px 80px;
  max-width: 1400px;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 1px solid var(--divider);
  padding-bottom: 18px;
  margin-bottom: 24px;
}
.page-title h1 {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--cream);
}
.page-title .subtitle {
  color: var(--cream-dim);
  font-size: 12px;
  margin-top: 4px;
}

.page-meta {
  font-size: 11px;
  color: var(--cream-dim);
  text-align: right;
}
.page-meta .count { color: var(--sky-light); font-weight: 500; }

/* ── Search bar ─────────────────────────────────────────── */
.search-row {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 18px;
  position: sticky;
  top: 0;
  background: var(--navy-deep);
  z-index: 5;
  padding: 8px 0 10px;
}
.search-input {
  flex: 1;
  background: var(--ghost);
  border: 1px solid var(--divider);
  color: var(--cream);
  padding: 11px 14px;
  font-family: var(--sans);
  font-size: 13px;
  border-radius: 4px;
  letter-spacing: 0.01em;
}
.search-input:focus {
  outline: none;
  border-color: var(--sky);
  background: var(--navy);
}
.search-input::placeholder { color: var(--cream-dim); }

.view-toggle {
  display: flex;
  border: 1px solid var(--divider);
  border-radius: 4px;
  overflow: hidden;
}
.view-toggle button {
  background: transparent;
  border: none;
  color: var(--cream-dim);
  padding: 9px 16px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}
.view-toggle button.active {
  background: var(--sky);
  color: var(--cream);
}

/* ── Category tabs ──────────────────────────────────────── */
.category-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--divider);
  padding-bottom: 12px;
}
.cat-tab {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--cream-dim);
  padding: 7px 14px;
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.04em;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.12s;
}
.cat-tab:hover { color: var(--cream); border-color: var(--sky); }
.cat-tab.active {
  background: var(--sky);
  color: var(--cream);
  border-color: var(--sky);
  font-weight: 500;
}
.cat-tab .badge {
  display: inline-block;
  margin-left: 5px;
  font-size: 10px;
  opacity: 0.7;
}

/* ── Layout split: filter rail + grid ───────────────────── */
.content-row {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 24px;
  align-items: flex-start;
}

/* ── Filter rail ────────────────────────────────────────── */
.filter-rail {
  background: var(--navy);
  border: 1px solid var(--divider);
  border-radius: 6px;
  padding: 16px;
  position: sticky;
  top: 76px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
}
.filter-rail h3 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--cream-dim);
  margin-bottom: 12px;
  font-weight: 500;
}
.filter-group { margin-bottom: 18px; }
.filter-group:last-child { margin-bottom: 0; }
.filter-group .label {
  font-size: 10px;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
  margin-bottom: 6px;
  display: block;
}
.filter-select {
  width: 100%;
  background: var(--ghost);
  border: 1px solid var(--divider);
  color: var(--cream);
  padding: 7px 8px;
  font-family: var(--sans);
  font-size: 12px;
  border-radius: 3px;
}
.filter-select:focus { outline: none; border-color: var(--sky); }

.filter-checks {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.filter-checks label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: var(--cream-dim);
  cursor: pointer;
  padding: 3px 0;
}
.filter-checks input[type="checkbox"] {
  accent-color: var(--sky);
  cursor: pointer;
}
.filter-checks label:hover { color: var(--cream); }

.filter-clear {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--cream-dim);
  padding: 7px 12px;
  font-size: 11px;
  letter-spacing: 0.04em;
  border-radius: 3px;
  cursor: pointer;
  width: 100%;
  margin-top: 8px;
  text-transform: uppercase;
  font-family: var(--sans);
  transition: color 0.12s, border-color 0.12s;
}
.filter-clear:hover { color: var(--cream); border-color: var(--sky); }

/* ── Exercise grid ──────────────────────────────────────── */
.results-area { min-height: 400px; }

.exercise-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
}

.ex-card {
  background: var(--navy);
  border: 1px solid var(--divider);
  border-radius: 6px;
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color 0.14s, transform 0.14s, background 0.14s;
}
.ex-card:hover {
  border-color: var(--sky);
  background: var(--navy-soft);
  transform: translateY(-1px);
}
.ex-card .ex-name {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 500;
  color: var(--cream);
  line-height: 1.3;
  margin-bottom: 4px;
}
.ex-card .ex-meta {
  font-size: 10px;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ex-card .ex-meta .pipe { color: var(--divider); }
.ex-card .ex-meta .source-tag {
  background: rgba(95, 155, 213, 0.1);
  color: var(--sky-light);
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 9px;
  letter-spacing: 0.06em;
  font-weight: 500;
}
.ex-card .ex-dose {
  font-size: 11px;
  color: var(--cream-dim);
  margin-bottom: 10px;
  font-style: italic;
}

.sens-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.sens-badge {
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
  border: 1px solid transparent;
}
.sens-badge.safe   { color: var(--optimal); border-color: rgba(76, 169, 138, 0.3); background: rgba(76, 169, 138, 0.08); }
.sens-badge.caution { color: var(--moderate); border-color: rgba(212, 168, 54, 0.3); background: rgba(212, 168, 54, 0.08); }
.sens-badge.avoid  { color: var(--limited); border-color: rgba(226, 92, 69, 0.3); background: rgba(226, 92, 69, 0.08); }

/* ── Table view ─────────────────────────────────────────── */
.exercise-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--navy);
  border: 1px solid var(--divider);
  border-radius: 6px;
  overflow: hidden;
}
.exercise-table th {
  background: var(--navy-soft);
  color: var(--cream-dim);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 500;
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--divider);
}
.exercise-table td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--divider);
  color: var(--cream);
  font-size: 12px;
  cursor: pointer;
}
.exercise-table tr:hover td { background: var(--navy-soft); }
.exercise-table tr:last-child td { border-bottom: none; }

/* ── Detail drawer ──────────────────────────────────────── */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(6, 13, 24, 0.7);
  display: none;
  z-index: 99;
  backdrop-filter: blur(2px);
}
.drawer-overlay.open { display: block; }

.detail-drawer {
  position: fixed;
  top: 0; right: -640px;
  width: 600px;
  height: 100vh;
  background: var(--navy);
  border-left: 1px solid var(--divider);
  z-index: 100;
  overflow-y: auto;
  transition: right 0.24s ease-out;
  box-shadow: -10px 0 30px rgba(0,0,0,0.4);
}
.detail-drawer.open { right: 0; }

.drawer-header {
  position: sticky;
  top: 0;
  background: var(--navy);
  border-bottom: 1px solid var(--divider);
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 1;
}
.drawer-close {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--cream-dim);
  padding: 5px 9px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
}
.drawer-close:hover { color: var(--cream); border-color: var(--sky); }

.drawer-body { padding: 18px 24px 60px; }
.drawer-name {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--cream);
  line-height: 1.25;
  margin-bottom: 4px;
}
.drawer-subtitle {
  font-size: 11px;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 18px;
}

.drawer-section {
  margin-bottom: 22px;
}
.drawer-section h4 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--sky-light);
  font-weight: 500;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--divider);
  padding-bottom: 5px;
}
.drawer-section p {
  font-size: 13px;
  line-height: 1.6;
  color: var(--cream);
  white-space: pre-wrap;
}
.drawer-section ul {
  list-style: none;
  padding: 0;
}
.drawer-section ul li {
  font-size: 13px;
  line-height: 1.6;
  color: var(--cream);
  padding: 4px 0 4px 14px;
  position: relative;
}
.drawer-section ul li::before {
  content: "·";
  position: absolute;
  left: 0;
  color: var(--sky-light);
  font-weight: 700;
}
.drawer-section .empty {
  color: var(--cream-dim);
  font-style: italic;
  font-size: 12px;
}

.drawer-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 24px;
}
.drawer-meta-grid .label {
  font-size: 10px;
  color: var(--cream-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.drawer-meta-grid .value {
  font-size: 13px;
  color: var(--cream);
  margin-top: 2px;
}
.drawer-meta-grid .value.empty {
  color: var(--cream-dim);
  font-style: italic;
}

.drawer-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
  padding: 14px;
  background: var(--ghost);
  border-radius: 4px;
}
.action-btn {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--cream);
  padding: 8px 14px;
  font-family: var(--sans);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.12s;
}
.action-btn:hover { border-color: var(--sky); color: var(--sky-light); }
.action-btn.primary {
  background: var(--sky);
  border-color: var(--sky);
  color: var(--cream);
  font-weight: 500;
}
.action-btn.primary:hover { background: var(--sky-light); border-color: var(--sky-light); color: var(--navy-deep); }

.json-view {
  background: var(--navy-deep);
  border: 1px solid var(--divider);
  border-radius: 4px;
  padding: 12px;
  font-family: 'Monaco', 'Consolas', monospace;
  font-size: 10px;
  color: var(--cream-dim);
  max-height: 280px;
  overflow: auto;
  white-space: pre;
  display: none;
}
.json-view.visible { display: block; }

/* ── Library health panel ───────────────────────────────── */
.health-panel {
  background: var(--navy);
  border: 1px solid var(--divider);
  border-radius: 6px;
  padding: 18px 22px;
  margin-bottom: 22px;
  display: none;
}
.health-panel.open { display: block; }
.health-panel h3 {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--cream);
  margin-bottom: 12px;
}
.health-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
}
.health-stat {
  background: var(--ghost);
  border-radius: 4px;
  padding: 10px 12px;
}
.health-stat .label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--cream-dim);
  font-weight: 500;
}
.health-stat .value {
  font-family: var(--serif);
  font-size: 22px;
  color: var(--sky-light);
  font-weight: 500;
  margin-top: 4px;
}
.health-stat .value.warn { color: var(--moderate); }
.health-stat .value.bad { color: var(--limited); }

.health-toggle {
  background: transparent;
  border: 1px solid var(--divider);
  color: var(--cream-dim);
  padding: 6px 12px;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
  font-family: var(--sans);
}
.health-toggle:hover { color: var(--cream); border-color: var(--sky); }

/* ── States ─────────────────────────────────────────────── */
.empty-state, .loading-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--cream-dim);
}
.empty-state h3 {
  font-family: var(--serif);
  font-size: 18px;
  color: var(--cream);
  margin-bottom: 8px;
  font-weight: 500;
}
.empty-state p { font-size: 13px; }

.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--divider);
  border-top-color: var(--sky-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width: 1024px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .content-row { grid-template-columns: 1fr; }
  .filter-rail { position: static; max-height: none; }
}
@media (max-width: 640px) {
  .main { padding: 18px 16px 60px; }
  .detail-drawer { width: 100%; right: -100%; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- ── Sidebar (shared IMS nav) ─────────────────────── -->
  <aside class="sidebar" data-ims-sidebar></aside>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="main">

    <header class="page-header">
      <div class="page-title">
        <h1>Exercise Library</h1>
        <div class="subtitle">Browse, filter, and reference every exercise in the IMS movement system.</div>
      </div>
      <div class="page-meta">
        <div><span id="result-count" class="count">—</span> showing</div>
        <button class="health-toggle" onclick="toggleHealth()" style="margin-top:6px;">Library Health</button>
      </div>
    </header>

    <!-- Library health panel -->
    <section id="health-panel" class="health-panel">
      <h3>Library Health</h3>
      <div id="health-content" class="health-grid"></div>
    </section>

    <!-- Search + view toggle -->
    <div class="search-row">
      <input id="search" type="text" class="search-input"
             placeholder="Search by name, joint, cue, or tag..." autocomplete="off" />
      <div class="view-toggle">
        <button id="view-grid" class="active" onclick="setView('grid')">Grid</button>
        <button id="view-table" onclick="setView('table')">Table</button>
      </div>
    </div>

    <!-- Category tabs -->
    <nav id="category-tabs" class="category-tabs"></nav>

    <!-- Filter + results split -->
    <div class="content-row">

      <aside class="filter-rail">
        <h3>Filters</h3>

        <div class="filter-group">
          <label class="label">Source Library</label>
          <select id="filter-source" class="filter-select">
            <option value="">Any source</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="label">Joint</label>
          <select id="filter-joint" class="filter-select">
            <option value="">Any joint</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="label">Direction</label>
          <select id="filter-direction" class="filter-select">
            <option value="">Any direction</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="label">Client Level</label>
          <select id="filter-level" class="filter-select">
            <option value="">Any level</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="label">Program Use</label>
          <select id="filter-program-use" class="filter-select">
            <option value="">Any block</option>
            <option value="warm_up">Warm-up</option>
            <option value="mobility">Mobility</option>
            <option value="strength_a">Strength A</option>
            <option value="strength_b">Strength B</option>
            <option value="strength_c">Strength C</option>
            <option value="cardio">Cardio</option>
            <option value="recovery">Recovery</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="label">Concern Safe</label>
          <div class="filter-checks">
            <label><input type="checkbox" id="safe-knee">Knee safe</label>
            <label><input type="checkbox" id="safe-shoulder">Shoulder safe</label>
            <label><input type="checkbox" id="safe-low-back">Low-back safe</label>
            <label><input type="checkbox" id="safe-wrist">Wrist safe</label>
          </div>
        </div>

        <button class="filter-clear" onclick="clearFilters()">Clear filters</button>
      </aside>

      <div class="results-area">
        <div id="loading" class="loading-state">
          <div class="spinner"></div>
          <p style="margin-top:12px;">Loading library…</p>
        </div>

        <div id="empty" class="empty-state" style="display:none;">
          <h3>No exercises match these filters</h3>
          <p>Try clearing some filters or simplifying your search.</p>
        </div>

        <div id="grid-view" class="exercise-grid" style="display:none;"></div>

        <div id="table-view" style="display:none;">
          <table class="exercise-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Source</th>
                <th>Joint</th>
                <th>Level</th>
                <th>Default Dose</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<!-- ── Detail drawer ─────────────────────────────────────── -->
<div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
<aside id="detail-drawer" class="detail-drawer">
  <div class="drawer-header">
    <div>
      <div id="drawer-name" class="drawer-name">Exercise</div>
      <div id="drawer-subtitle" class="drawer-subtitle"></div>
    </div>
    <button class="drawer-close" onclick="closeDrawer()" aria-label="Close">×</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<script>
// ─────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────
let ALL_ITEMS = [];
let FILTERED = [];
let CURRENT_VIEW = 'grid';
let CURRENT_CATEGORY = 'All';

// ─────────────────────────────────────────────────────────
// Boot
// ─────────────────────────────────────────────────────────
async function boot() {
  try {
    const [exRes, hlRes] = await Promise.all([
      fetch('/api/library/exercises'),
      fetch('/api/library/health'),
    ]);
    const exData = await exRes.json();
    ALL_ITEMS = exData.exercises || [];
    renderCategoryTabs();
    populateSourceFilter();
    populateJointFilter();
    populateDirectionFilter();
    applyFilters();

    const hlData = await hlRes.json();
    renderHealthPanel(hlData);
  } catch (e) {
    document.getElementById('loading').innerHTML =
      `<p style="color:var(--limited)">Failed to load: ${e.message}</p>`;
  }
}

function renderCategoryTabs() {
  const counts = {};
  ALL_ITEMS.forEach(it => { counts[it.category] = (counts[it.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts).sort()];
  const wrap = document.getElementById('category-tabs');
  wrap.innerHTML = cats.map(cat => {
    const isActive = cat === CURRENT_CATEGORY;
    const n = cat === 'All' ? ALL_ITEMS.length : (counts[cat] || 0);
    return `<button class="cat-tab ${isActive ? 'active' : ''}" onclick="setCategory('${cat}')">
      ${cat}<span class="badge">${n}</span>
    </button>`;
  }).join('');
}

function populateSourceFilter() {
  const sources = [...new Set(ALL_ITEMS.map(it => it.source_library))].sort();
  const sel = document.getElementById('filter-source');
  sel.innerHTML = '<option value="">Any source</option>' +
    sources.map(s => `<option value="${s}">${prettySource(s)}</option>`).join('');
}

function populateJointFilter() {
  const joints = [...new Set(ALL_ITEMS.map(it => it.joint).filter(Boolean))].sort();
  const sel = document.getElementById('filter-joint');
  sel.innerHTML = '<option value="">Any joint</option>' +
    joints.map(j => `<option value="${j}">${capitalize(j)}</option>`).join('');
}

function populateDirectionFilter() {
  const dirs = [...new Set(ALL_ITEMS.map(it => it.direction).filter(Boolean))].sort();
  const sel = document.getElementById('filter-direction');
  sel.innerHTML = '<option value="">Any direction</option>' +
    dirs.map(d => `<option value="${d}">${capitalize(d)}</option>`).join('');
}

function prettySource(s) {
  return s.replace(/_/g, ' ').replace(/\blibrary\b/i, '').trim()
    .replace(/\b\w/g, c => c.toUpperCase());
}
function capitalize(s) { return (s || '').charAt(0).toUpperCase() + (s || '').slice(1); }

// ─────────────────────────────────────────────────────────
// Filtering
// ─────────────────────────────────────────────────────────
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const src = document.getElementById('filter-source').value;
  const joint = document.getElementById('filter-joint').value;
  const direction = document.getElementById('filter-direction').value;
  const level = document.getElementById('filter-level').value;
  const programUse = document.getElementById('filter-program-use').value;
  const safeKnee = document.getElementById('safe-knee').checked;
  const safeShoulder = document.getElementById('safe-shoulder').checked;
  const safeBack = document.getElementById('safe-low-back').checked;
  const safeWrist = document.getElementById('safe-wrist').checked;

  FILTERED = ALL_ITEMS.filter(it => {
    if (CURRENT_CATEGORY !== 'All' && it.category !== CURRENT_CATEGORY) return false;
    if (src && it.source_library !== src) return false;
    if (joint && (it.joint || '').toLowerCase() !== joint.toLowerCase()) return false;
    if (direction && (it.direction || '').toLowerCase() !== direction.toLowerCase()) return false;
    if (level && (it.client_level || '').toLowerCase() !== level) return false;
    if (programUse && !(it.program_uses || []).includes(programUse)) return false;
    const sens = it.sensitivity || {};
    if (safeKnee && (sens.knee === 'avoid' || sens.knee === 'caution')) return false;
    if (safeShoulder && (sens.shoulder === 'avoid' || sens.shoulder === 'caution')) return false;
    if (safeBack && (sens.low_back === 'avoid' || sens.low_back === 'caution')) return false;
    if (safeWrist && (sens.wrist === 'avoid' || sens.wrist === 'caution')) return false;
    if (q) {
      const hay = [
        it.name, (it.tags || []).join(' '), it.rationale,
        (it.coaching_cues || []).join(' '), it.movement_category,
        it.joint, it.direction,
      ].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('result-count').textContent = FILTERED.length.toLocaleString();
  document.getElementById('loading').style.display = 'none';
  renderResults();
}

function renderResults() {
  const empty = document.getElementById('empty');
  const grid = document.getElementById('grid-view');
  const table = document.getElementById('table-view');

  if (FILTERED.length === 0) {
    empty.style.display = 'block';
    grid.style.display = 'none';
    table.style.display = 'none';
    return;
  }
  empty.style.display = 'none';

  if (CURRENT_VIEW === 'grid') {
    grid.style.display = 'grid';
    table.style.display = 'none';
    grid.innerHTML = FILTERED.slice(0, 300).map(renderCard).join('');
  } else {
    grid.style.display = 'none';
    table.style.display = 'block';
    document.getElementById('table-body').innerHTML =
      FILTERED.slice(0, 300).map(renderRow).join('');
  }

  // Truncation note
  if (FILTERED.length > 300) {
    const note = `<p style="grid-column:1/-1;color:var(--cream-dim);text-align:center;
                  margin-top:14px;font-size:11px;">
                  Showing first 300 of ${FILTERED.length.toLocaleString()} · refine filters to narrow.</p>`;
    if (CURRENT_VIEW === 'grid') grid.insertAdjacentHTML('beforeend', note);
  }
}

// ─────────────────────────────────────────────────────────
// Card + row rendering
// ─────────────────────────────────────────────────────────
function renderCard(it) {
  const sens = it.sensitivity || {};
  const sensBadges = ['knee', 'shoulder', 'low_back', 'wrist']
    .map(k => sens[k] ? `<span class="sens-badge ${sens[k]}">${k.replace('_', ' ')} ${sens[k]}</span>` : '')
    .filter(Boolean).join('');
  const dose = it.default_dose ? `<div class="ex-dose">${escapeHtml(it.default_dose)}</div>` : '';
  return `
    <div class="ex-card" onclick="openDrawer('${it.id}')">
      <div class="ex-name">${escapeHtml(it.name)}</div>
      <div class="ex-meta">
        <span>${escapeHtml(it.category)}</span>
        <span class="pipe">·</span>
        <span class="source-tag">${escapeHtml(prettySource(it.source_library))}</span>
      </div>
      ${dose}
      <div class="sens-badges">${sensBadges}</div>
    </div>
  `;
}

function renderRow(it) {
  return `
    <tr onclick="openDrawer('${it.id}')">
      <td>${escapeHtml(it.name)}</td>
      <td>${escapeHtml(it.category)}</td>
      <td>${escapeHtml(prettySource(it.source_library))}</td>
      <td>${escapeHtml(it.joint || '—')}</td>
      <td>${escapeHtml(it.client_level || '—')}</td>
      <td>${escapeHtml(it.default_dose || '—')}</td>
    </tr>
  `;
}

// ─────────────────────────────────────────────────────────
// Detail drawer
// ─────────────────────────────────────────────────────────
function openDrawer(id) {
  const it = ALL_ITEMS.find(x => x.id === id);
  if (!it) return;
  document.getElementById('drawer-name').textContent = it.name;
  document.getElementById('drawer-subtitle').textContent =
    `${it.category} · ${prettySource(it.source_library)}`;

  const sens = it.sensitivity || {};
  const sensBadges = ['knee', 'shoulder', 'low_back', 'wrist', 'hip']
    .map(k => sens[k] ? `<span class="sens-badge ${sens[k]}">${k.replace('_', ' ')} ${sens[k]}</span>` : '')
    .filter(Boolean).join('');

  const cues = (it.coaching_cues || []).filter(Boolean);
  const mistakes = (it.mistakes || []).filter(Boolean);
  const progressions = (it.progressions || []).filter(Boolean);
  const regressions = (it.regressions || []).filter(Boolean);
  const tags = (it.tags || []).filter(Boolean);
  const equipment = (it.equipment || []).filter(Boolean);
  const programUses = (it.program_uses || []).filter(Boolean);
  const contras = (it.contraindications || []).filter(Boolean);

  const html = `
    <div class="drawer-actions">
      <button class="action-btn primary" onclick="mockAction('add', '${it.id}')">Add to Plan</button>
      <button class="action-btn" onclick="mockAction('replace', '${it.id}')">Replace Exercise</button>
      <button class="action-btn" onclick="mockAction('copy', '${it.id}')">Copy Exercise</button>
      <button class="action-btn" onclick="toggleJsonView()">View JSON</button>
    </div>

    <div class="drawer-section">
      <h4>Quick reference</h4>
      <div class="drawer-meta-grid">
        <div>
          <div class="label">Default dose</div>
          <div class="value ${it.default_dose ? '' : 'empty'}">${escapeHtml(it.default_dose || 'Not specified')}</div>
        </div>
        <div>
          <div class="label">Client level</div>
          <div class="value ${it.client_level ? '' : 'empty'}">${escapeHtml(it.client_level || 'Not specified')}</div>
        </div>
        <div>
          <div class="label">Joint</div>
          <div class="value ${it.joint ? '' : 'empty'}">${escapeHtml(it.joint || 'Not specified')}</div>
        </div>
        <div>
          <div class="label">Direction</div>
          <div class="value ${it.direction ? '' : 'empty'}">${escapeHtml(it.direction || 'Not specified')}</div>
        </div>
        <div>
          <div class="label">Movement category</div>
          <div class="value ${it.movement_category ? '' : 'empty'}">${escapeHtml(it.movement_category || 'Not specified')}</div>
        </div>
        <div>
          <div class="label">Equipment</div>
          <div class="value ${equipment.length ? '' : 'empty'}">${equipment.length ? equipment.map(escapeHtml).join(', ') : 'Not specified'}</div>
        </div>
      </div>
    </div>

    ${sensBadges ? `
    <div class="drawer-section">
      <h4>Sensitivity</h4>
      <div class="sens-badges">${sensBadges}</div>
    </div>` : ''}

    ${programUses.length ? `
    <div class="drawer-section">
      <h4>Program use</h4>
      <p>${programUses.map(u => u.replace('_', ' ')).map(escapeHtml).join(' · ')}</p>
    </div>` : ''}

    ${it.setup ? `
    <div class="drawer-section">
      <h4>Setup</h4>
      <p>${escapeHtml(it.setup)}</p>
    </div>` : ''}

    ${it.execution ? `
    <div class="drawer-section">
      <h4>Execution</h4>
      <p>${escapeHtml(it.execution)}</p>
    </div>` : ''}

    ${cues.length ? `
    <div class="drawer-section">
      <h4>Coaching cues</h4>
      <ul>${cues.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
    </div>` : ''}

    ${mistakes.length ? `
    <div class="drawer-section">
      <h4>Common mistakes</h4>
      <ul>${mistakes.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul>
    </div>` : ''}

    ${progressions.length ? `
    <div class="drawer-section">
      <h4>Progressions</h4>
      <ul>${progressions.map(p => `<li>${escapeHtml(p)}</li>`).join('')}</ul>
    </div>` : ''}

    ${regressions.length ? `
    <div class="drawer-section">
      <h4>Regressions</h4>
      <ul>${regressions.map(r => `<li>${escapeHtml(r)}</li>`).join('')}</ul>
    </div>` : ''}

    ${it.rationale ? `
    <div class="drawer-section">
      <h4>Rationale</h4>
      <p>${escapeHtml(it.rationale)}</p>
    </div>` : ''}

    ${tags.length ? `
    <div class="drawer-section">
      <h4>Tags</h4>
      <p>${tags.map(escapeHtml).join(' · ')}</p>
    </div>` : ''}

    ${contras.length ? `
    <div class="drawer-section">
      <h4>Contraindications</h4>
      <ul>${contras.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
    </div>` : ''}

    <div class="drawer-section">
      <h4>Raw JSON</h4>
      <pre id="json-view" class="json-view">${escapeHtml(JSON.stringify(it.raw, null, 2))}</pre>
    </div>
  `;
  document.getElementById('drawer-body').innerHTML = html;

  document.getElementById('detail-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}

function closeDrawer() {
  document.getElementById('detail-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

function toggleJsonView() {
  document.getElementById('json-view').classList.toggle('visible');
}

// ─────────────────────────────────────────────────────────
// Health panel
// ─────────────────────────────────────────────────────────
function renderHealthPanel(h) {
  if (!h || h.error) return;
  const el = document.getElementById('health-content');
  const cards = [
    { label: 'Total Exercises', value: h.total_exercises, css: '' },
    { label: 'Categories', value: Object.keys(h.category_counts || {}).length, css: '' },
    { label: 'Source Libraries', value: Object.keys(h.source_library_counts || {}).length, css: '' },
    { label: 'Duplicate Names', value: h.duplicate_count, css: h.duplicate_count > 50 ? 'warn' : '' },
    { label: 'Missing Default Dose', value: h.missing_default_dose, css: h.missing_default_dose > 100 ? 'warn' : '' },
    { label: 'Missing Sensitivity', value: h.missing_sensitivity_tags, css: h.missing_sensitivity_tags > 200 ? 'warn' : '' },
  ];
  el.innerHTML = cards.map(c => `
    <div class="health-stat">
      <div class="label">${c.label}</div>
      <div class="value ${c.css}">${c.value.toLocaleString()}</div>
    </div>
  `).join('');
}

function toggleHealth() {
  document.getElementById('health-panel').classList.toggle('open');
}

// ─────────────────────────────────────────────────────────
// View switching
// ─────────────────────────────────────────────────────────
function setView(v) {
  CURRENT_VIEW = v;
  document.getElementById('view-grid').classList.toggle('active', v === 'grid');
  document.getElementById('view-table').classList.toggle('active', v === 'table');
  renderResults();
}

function setCategory(cat) {
  CURRENT_CATEGORY = cat;
  document.querySelectorAll('.cat-tab').forEach(b => {
    b.classList.toggle('active', b.textContent.startsWith(cat));
  });
  applyFilters();
}

function clearFilters() {
  document.getElementById('search').value = '';
  ['filter-source', 'filter-joint', 'filter-direction', 'filter-level', 'filter-program-use'].forEach(id => {
    document.getElementById(id).value = '';
  });
  ['safe-knee', 'safe-shoulder', 'safe-low-back', 'safe-wrist'].forEach(id => {
    document.getElementById(id).checked = false;
  });
  CURRENT_CATEGORY = 'All';
  renderCategoryTabs();
  applyFilters();
}

function mockAction(action, id) {
  const it = ALL_ITEMS.find(x => x.id === id);
  alert(`[Mock action: ${action}]\n\nWould send "${it.name}" to the Plan Editor when that screen ships.`);
}

// ─────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// Wire up listeners
document.getElementById('search').addEventListener('input', debounce(applyFilters, 150));
['filter-source', 'filter-joint', 'filter-direction', 'filter-level', 'filter-program-use']
  .forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
['safe-knee', 'safe-shoulder', 'safe-low-back', 'safe-wrist']
  .forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
});

function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}

boot();
</script>
<script src="/assets/ims-nav.js"></script>
</body>
</html>
