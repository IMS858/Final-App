<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Master Calendar · IMS Coach OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ims-ui.css">

<!-- Tailwind via CDN with strong preflight so the calendar gets clean baseline -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { corePlugins: { preflight: true } };
</script>

<style>
  /* Cancel ims-ui.css's universal reset INSIDE the calendar root so
     Tailwind's preflight + the calendar's spacing render correctly. */
  .ims-canvas { padding: 0; }
  #cal-root {
    min-height: calc(100vh - var(--shell-topbar));
    background: #0f172a;
    color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #cal-root * { box-sizing: border-box; }
  #cal-root ol, #cal-root ul { list-style: revert; padding-left: revert; }
  #cal-root button, #cal-root input, #cal-root select, #cal-root textarea {
    font: inherit;
    color: inherit;
  }
  #cal-root h1, #cal-root h2, #cal-root h3,
  #cal-root h4, #cal-root h5, #cal-root h6 {
    font-size: revert;
    font-weight: revert;
    margin: revert;
  }
  #cal-root p { margin: revert; }
  #cal-root, #cal-root * {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .cal-fallback {
    padding: 32px;
    color: var(--cream-dim);
    font-size: 13px;
  }
  .cal-fallback strong { color: var(--cream); }
</style>
</head>
<body>

<div class="ims-app">
  <aside data-ims-sidebar></aside>
  <main class="ims-main">
    <header class="ims-topbar">
      <div class="crumbs">
        <span class="crumb-eyebrow">SCHEDULE</span>
        <h1 class="crumb-title">Master <em>Calendar</em>.</h1>
      </div>
      <span class="env-badge">Demo data</span>
    </header>
    <div class="ims-canvas">
      <div id="cal-root">
        <div class="cal-fallback">
          <strong>Loading Master Calendar…</strong><br>
          If this message stays for more than 5 seconds, check the browser console for errors.
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/assets/ims-nav.js"></script>

<!-- Pre-built calendar bundle: React + ReactDOM + lucide-react + JSX baked in. -->
<script src="/assets/ims-master-calendar.bundle.js"></script>

</body>
</html>
